name: balai_silayan
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.6+6

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  socket_io_client: ^2.0.3
  mobile_scanner: ^5.2.3
  image_picker: ^1.2.4
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.1.0
  audioplayers: ^6.0.0
  flutter_local_notifications: ^20.0.0
  permission_handler: ^11.0.0
  supabase_flutter: ^2.18.3
  intl: ^0.20.1
  js: ^0.6.7
  image_picker_for_web: ^3.1.1
  flutter_web_plugins:
    sdk: flutter
  image_picker_web: ^4.0.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  gal: ^2.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Regular.ttf
          weight: 400
        - asset: assets/fonts/LibreBaskerville-Bold.ttf
          weight: 700
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800

  assets:
    - .env
    - assets/sounds/notification_ring.mp3
    - assets/fonts/
    - lib/menus/
    - lib/logo/
